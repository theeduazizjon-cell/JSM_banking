<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <title>Ledgerly</title>
  <defs>
    <linearGradient id="ledgerly-bg" x1="4" y1="2" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0179FE"/>
      <stop offset="1" stop-color="#1F4FD1"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="34" height="34" rx="10" fill="url(#ledgerly-bg)"/>
  <!-- Three ledger lines of decreasing length, with a balance dot -->
  <rect x="9" y="10" width="18" height="3.5" rx="1.75" fill="#FFFFFF"/>
  <rect x="9" y="16.25" width="13" height="3.5" rx="1.75" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="9" y="22.5" width="8" height="3.5" rx="1.75" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="25" cy="24.25" r="2.75" fill="#7CC4FF"/>
</svg>
